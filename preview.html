<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handlytics — перегляд екранів</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#1d3c2d;background:#eaf0e9}.toolbar{padding:16px 22px;background:#fff;border-bottom:1px solid #d3ded4;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{font-weight:700;font-size:19px;margin-right:auto}.presets{display:flex;gap:6px;flex-wrap:wrap}button,a{font:inherit;border:1px solid #d3ded4;background:#fff;color:#1d3c2d;border-radius:8px;padding:10px 13px;cursor:pointer;text-decoration:none}button.active{background:#1d4936;color:white;border-color:#1d4936}button:hover{border-color:#649276}input{width:78px;padding:9px;border:1px solid #c9d7cc;border-radius:6px;font:inherit}label{font-size:12px}form{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.subbar{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px;font-size:12px;flex-wrap:wrap}.subbar button{padding:6px 10px;font-size:12px}.stage{overflow:auto;padding:24px;min-height:70vh}.screen-space{margin:0 auto;position:relative}.device{position:absolute;top:0;left:0;transform-origin:top left;background:white;border:7px solid #203c30;border-radius:14px;box-shadow:0 18px 60px #19352a22;overflow:hidden}iframe{display:block;border:0;background:white}p.note{text-align:center;font-size:11px;color:#63786b;margin:0 20px 20px}:focus-visible{outline:3px solid #77ac8c;outline-offset:3px}@media(max-width:650px){.toolbar{padding:12px;gap:10px}.brand{width:100%}.presets button{font-size:12px;padding:9px}.stage{padding:12px}}</style></head><body><div class="toolbar"><span class="brand">Handlytics <small style="font-weight:400;font-size:12px">/ екрани</small></span><div class="themes" role="group" aria-label="Дизайн сайту"><button type="button" data-theme="light">Світлий</button><button type="button" data-theme="dark">Темний</button></div><div class="presets" role="group" aria-label="Розмір екрана"><button data-w="390" data-h="844">Телефон</button><button data-w="768" data-h="1024">Планшет</button><button data-w="1366" data-h="768" class="active">Ноутбук</button><button data-w="1920" data-h="1080">Монітор</button></div><a href="index.html" target="_blank">Відкрити сайт ↗</a></div><div class="subbar"><form id="dimensions"><label>Ширина <input id="width" type="number" min="280" max="3840" value="1366" required></label><span>×</span><label>Висота <input id="height" type="number" min="320" max="2160" value="768" required></label><button>Застосувати</button></form><button id="rotate" title="Поміняти ширину та висоту">↻ Повернути</button><button id="fit" aria-pressed="false">Вписати у вікно</button><button id="actual" aria-pressed="true">Масштаб 100%</button><span id="status" role="status"></span></div><p class="note">Сайт усередині інтерактивний. Прокручуй його й перевіряй меню та кнопки. Це перегляд адаптивної верстки, а не емулятор конкретного пристрою.</p><main class="stage"><div class="screen-space"><div class="device"><iframe src="index.html?v=35" title="Handlytics у вибраному розмірі екрана"></iframe></div></div></main><script>const w=document.querySelector('#width'),h=document.querySelector('#height'),stage=document.querySelector('.stage'),space=document.querySelector('.screen-space'),device=document.querySelector('.device'),frame=document.querySelector('iframe');let fit=false;function render(){const width=Number(w.value),height=Number(h.value);const available=stage.clientWidth-(window.innerWidth<650?24:48);const scale=fit?Math.min(1,available/(width+14)):1;frame.style.width=width+'px';frame.style.height=height+'px';device.style.width=width+14+'px';device.style.height=height+14+'px';device.style.transform='scale('+scale+')';space.style.width=(width+14)*scale+'px';space.style.height=(height+14)*scale+'px';document.querySelector('#status').textContent=width+' × '+height+' · '+Math.round(scale*100)+'%';document.querySelectorAll('[data-w]').forEach(b=>{const active=Number(b.dataset.w)===width&&Number(b.dataset.h)===height;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelector('#fit').setAttribute('aria-pressed',String(fit));document.querySelector('#actual').setAttribute('aria-pressed',String(!fit));document.querySelector('#fit').classList.toggle('active',fit);document.querySelector('#actual').classList.toggle('active',!fit)}document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w.value=b.dataset.w;h.value=b.dataset.h;render()});document.querySelector('#dimensions').onsubmit=e=>{e.preventDefault();render()};document.querySelector('#rotate').onclick=()=>{const old=w.value;w.value=h.value;h.value=old;render()};document.querySelector('#fit').onclick=()=>{fit=true;render()};document.querySelector('#actual').onclick=()=>{fit=false;render()};window.addEventListener('resize',render);w.value=Math.max(320,Math.floor(stage.clientWidth-48));h.value=900;render();document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-theme]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});frame.contentWindow.postMessage({type:'handlytics-theme',theme:b.dataset.theme},location.origin)}));</script></body></html>
